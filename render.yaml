services:
  - type: web
    name: csitary-visual-audit-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PORT
        value: "10000"
